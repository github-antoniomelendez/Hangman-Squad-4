<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Hangman</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>HANGMAN</h1>

    <!-- Difficulty Selection -->
    <div class="difficulty-section">

      <button class="difficulty easy" onclick="setDifficulty('easy')">
        EASY
      </button>

      <button class="difficulty medium" onclick="setDifficulty('medium')">
        MEDIUM
      </button>

      <button class="difficulty hard" onclick="setDifficulty('hard')">
        HARD
      </button>

    </div>

    <!-- Timer -->
    <div class="timer" id="timer">
      No Time Limit
    </div>

    <!-- Game Area -->
    <div class="game-area">

      <!-- Hangman -->
      <div class="hangman-box">

        <div class="gallows"></div>

        <div class="head hidden"></div>
        <div class="body hidden"></div>
        <div class="left-arm hidden"></div>
        <div class="right-arm hidden"></div>
        <div class="left-leg hidden"></div>
        <div class="right-leg hidden"></div>

      </div>

      <!-- Wrong Letters -->
      <div class="wrong-guesses">
        <h3>Incorrect Guesses</h3>
        <p id="wrongLetters"></p>
      </div>

    </div>

    <!-- Word Display -->
    <div class="word-display" id="wordDisplay">
    </div>

    <!-- Keyboard -->
    <div class="keyboard" id="keyboard">
    </div>

    <!-- Restart -->
    <button id="restartBtn">
      Play Again
    </button>

    <!-- End Game Message -->
    <div class="message hidden" id="messageBox">

      <h2 id="messageTitle"></h2>

      <p>
        The word was:
        <span id="finalWord"></span>
      </p>

    </div>

  </div>

  <!-- WIN SOUND -->
  <audio id="winSound">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>

</body>

</html>
