<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Hangman Game</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>HANGMAN</h1>

    <!-- Difficulty Selection -->
    <div class="difficulty-section">

      <button class="difficulty easy" onclick="setDifficulty('easy')">
        EASY
      </button>

      <button class="difficulty medium" onclick="setDifficulty('medium')">
        MEDIUM
      </button>

      <button class="difficulty hard" onclick="setDifficulty('hard')">
        HARD
      </button>

    </div>

    <!-- Timer -->
    <div class="timer" id="timer">
      No Time Limit
    </div>

    <!-- High Score -->
    <div class="high-score">
      High Score:
      <span id="highScore">0</span>
    </div>

    <!-- Game Area -->
    <div class="game-area">

      <!-- Hangman Drawing -->
      <div class="hangman-box">

        <div class="gallows"></div>

        <div class="rope hidden"></div>

        <div class="head hidden"></div>

        <div class="body hidden"></div>

        <div class="left-arm hidden"></div>

        <div class="right-arm hidden"></div>

        <div class="left-leg hidden"></div>

        <div class="right-leg hidden"></div>

      </div>

      <!-- Wrong Letters -->
      <div class="wrong-guesses">

        <h3>Incorrect Guesses</h3>

        <p id="wrongLetters"></p>

      </div>

    </div>

    <!-- Category -->
    <div class="category-display">
      Category:
      <span id="categoryText"></span>
    </div>

    <!-- Hint Display -->
    <div class="hint-display">
      Hint:
      <span id="hintText">None</span>
    </div>

    <!-- Word Display -->
    <div class="word-display" id="wordDisplay">
    </div>

    <!-- Keyboard -->
    <div class="keyboard" id="keyboard">
    </div>

    <!-- Restart Button -->
    <button id="restartBtn">
      Play Again
    </button>

    <button id="hintBtn">
      Show Hint
    </button>

    <!-- End Game Message -->
    <div class="message hidden" id="messageBox">

      <h2 id="messageTitle"></h2>

      <p>
        The word was:
        <span id="finalWord"></span>
      </p>

    </div>

  </div>

  <!-- Winning Sound -->
  <audio id="winSound" preload="auto">
    <source src="winningsound.wav" type="audio/wav">
  </audio>

  <!-- Losing Sound -->
  <audio id="loseSound" preload="auto">
    <source src="losingsound.wav" type="audio/wav">
  </audio>

  <script src="script.js"></script>

</body>

</html>
