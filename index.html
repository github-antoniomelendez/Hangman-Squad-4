<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hangman Game</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>HANGMAN</h1>

    <div class="game-area">

      <div class="hangman-box">
        <div class="gallows">
          <div class="pole"></div>
          <div class="top-bar"></div>
          <div class="rope"></div>

          <div class="head hidden"></div>
          <div class="body hidden"></div>
          <div class="left-arm hidden"></div>
          <div class="right-arm hidden"></div>
          <div class="left-leg hidden"></div>
          <div class="right-leg hidden"></div>
        </div>
      </div>

      <div class="wrong-guesses">
        <h3>Incorrect Guesses</h3>
        <p id="wrongLetters"></p>
      </div>

    </div>

    <div class="word-display" id="wordDisplay">
      _ _ _ _ _
    </div>

    <div class="keyboard" id="keyboard"></div>

    <button id="restartBtn">Restart Game</button>

    <div class="message hidden" id="messageBox">
      <h2 id="messageTitle"></h2>
      <p>The word was: <span id="finalWord"></span></p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
